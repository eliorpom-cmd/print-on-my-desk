<!-- The mark, drawn on the same grid the printer draws on: one circle per
     dot, 24 across by 20 down, an envelope going into a slot.

     TWO FILES AND NO <style> BLOCK, on purpose. GitHub strips <style> out of
     any SVG it renders in a README, so a single file that switched colour with
     prefers-color-scheme would come out invisible on one of the two themes -
     which is exactly what it did. The README picks between these with
     <picture> instead, which GitHub does honour.

     Generated from the same drawing as the site icon. Edit both or neither. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="20" viewBox="0 0 24 20" fill="#14140f" role="img">
